[project]
name = "rag-framework"
version = "0.1.0"
description = "Modular research framework for iterative retrieval-augmented generation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "rank-bm25>=0.2.2",
    "openai>=1.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "certifi>=2024.0",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "scipy>=1.11",
    "pandas>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rag_framework", "crucible", "prefnugget", "research"]
